<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>YouTube Caption Extractor</title>
  <style>
    body { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; width: 340px; padding: 12px; margin: 0; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    label { display: block; font-size: 11px; color: #666; margin-bottom: 4px; }
    input[type=text], select {
      width: 100%; box-sizing: border-box; padding: 5px 6px; margin-bottom: 10px;
      font-family: inherit; font-size: 12px; border: 1px solid #c8c8c8; border-radius: 3px;
      background: white;
    }
    button {
      display: block; width: 100%; padding: 8px; font: inherit; font-weight: 600;
      cursor: pointer; background: #ff0033; color: white; border: 0; border-radius: 3px;
    }
    button:disabled { background: #999; cursor: progress; }
    #status { font-size: 12px; color: #333; margin-top: 10px; min-height: 36px; white-space: pre-wrap; line-height: 1.4; }
    #status.error { color: #c50f1f; }
    .meta { font-size: 11px; color: #666; margin-top: 10px; line-height: 1.4; }
    .format-row { display: flex; gap: 12px; margin: 0 0 10px; font-size: 12px; }
    .format-row label { display: inline-flex; align-items: center; gap: 4px; margin: 0; color: #333; cursor: pointer; }
    .format-row input[type=radio] { margin: 0; }
  </style>
</head>
<body>
  <h1>YouTube Caption Extractor</h1>
  <label for="filename">Filename (without extension; blank = video title)</label>
  <input type="text" id="filename" placeholder="auto">
  <label for="track">Caption track</label>
  <select id="track" disabled>
    <option>Loading caption tracks...</option>
  </select>
  <label>Format</label>
  <div class="format-row">
    <label><input type="radio" name="format" value="vtt" checked> WebVTT (.vtt)</label>
    <label><input type="radio" name="format" value="md"> Markdown (.md)</label>
  </div>
  <button id="extract" disabled>Extract &amp; Download</button>
  <div id="status">Open a YouTube video with captions.</div>
  <div class="meta">
    Reads the timed-text track already exposed by YouTube for the current video.
    Manual and auto-generated tracks are supported.
  </div>
  <script src="popup.js"></script>
</body>
</html>
